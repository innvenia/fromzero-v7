name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONARQUBE_URL: ${{ vars.SONARQUBE_URL || secrets.SONARQUBE_URL }}
      SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Setup npm
        run: npm install -g npm@11.14.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: SonarQube scan
        if: ${{ env.SONARQUBE_TOKEN != '' && env.SONARQUBE_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_HOST_URL: ${{ env.SONARQUBE_URL }}
          SONAR_TOKEN: ${{ env.SONARQUBE_TOKEN }}
